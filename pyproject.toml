[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eas-shield"
version = "0.1.0"
description = "Epistemic Action Shielding research prototype and reproducible experiment suite"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Gehad Abdelal"}
]
keywords = ["epistemic logic", "action shielding", "multi-agent systems", "safe AI"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
experiments = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "torch>=2.2",
]
test = [
  "pytest>=8",
  "pytest-cov>=5",
]
dev = [
  "eas-shield[experiments,test]",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["eas_shield"]

[tool.coverage.report]
show_missing = true
skip_covered = false
